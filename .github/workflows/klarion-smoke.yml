name: klarion-smoke

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EXPECT_VERSION: "0.3.2"
    steps:
      - uses: actions/checkout@v6

      - run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Klarion
        id: klarion
        continue-on-error: true
        uses: 0x1Adi/Klarion@v0.3.2

      - name: Check results
        env:
          OUTCOME: ${{ steps.klarion.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          test -s klarion.sarif || fail "no SARIF report, see the Klarion step log"
          installed=$(klarion version)
          case "$installed" in "klarion $EXPECT_VERSION "*) ;; *) fail "installed '$installed', expected $EXPECT_VERSION" ;; esac
          jq -r '.runs[].results[].message.text' klarion.sarif
          count() { jq "[.runs[].results[] | select((.locations[0].physicalLocation.artifactLocation.uri // \"\") | endswith(\"$1\")) | select(.message.text | contains(\"$2\"))] | length" klarion.sarif; }
          planted=$(count config.py ""); confirmed=$(count config.py "(secret)"); clean=$(count clean.py "")
          uploaded=""
          for i in 1 2 3 4 5 6; do
            uploaded=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?per_page=1" --jq ".[0] | select(.created_at >= \"$STARTED\") | .results_count") || uploaded=""
            [ -n "$uploaded" ] && break
            sleep 5
          done
          echo "step=$OUTCOME exit=$KLARION_EXIT upload=$KLARION_UPLOAD planted=$planted confirmed=$confirmed clean=$clean uploaded_results=${uploaded:-none}"
          [ "$planted" -ge 1 ] || fail "missed the planted password in config.py"
          [ "$confirmed" -ge 1 ] || fail "the AI check did not confirm the planted password"
          [ "$clean" -eq 0 ] || fail "flagged clean.py, which has no secret"
          [ "$OUTCOME" = "failure" ] || fail "the Klarion step passed with a secret present"
          [ "$KLARION_EXIT" = "1" ] || fail "Klarion exit was '$KLARION_EXIT', expected 1 for findings"
          [ "$KLARION_UPLOAD" = "success" ] || fail "upload outcome was '$KLARION_UPLOAD', expected success"
          test -s .klarion/verdicts.json || fail "no verdict cache was written"
          [ "${uploaded:-0}" -ge 1 ] || fail "no upload with results reached the Security tab in this run"
          echo "Smoke test passed"

  upload-rejected:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Klarion on a clean file, without upload permission
        uses: 0x1Adi/Klarion@v0.3.2
        with:
          path: clean.py
          ai-mode: "off"

      - name: Check a rejected upload did not fail the build
        run: |
          echo "exit=$KLARION_EXIT upload=$KLARION_UPLOAD"
          [ "$KLARION_UPLOAD" = "failure" ] || { echo "::error::expected GitHub to reject the upload"; exit 1; }
          [ "$KLARION_EXIT" = "0" ] || { echo "::error::expected a clean scan"; exit 1; }
          echo "Rejected upload handled"
